[package]
name = "herdr-workspacer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MRU fuzzy workspace picker for Herdr, powered by open workspaces and zoxide."
license = "MIT"
repository = "https://github.com/mcuste/herdr-workspacer"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "herdr-workspacer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
fuzzy-matcher = "0.3.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
async_yields_async = "deny"
large_futures = "warn"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
integer_division = "deny"

[package.metadata.cargo-machete]
ignored = [
    "prost",
    "serde_derive",
    "thiserror",
    "tracing-attributes",
    "log",
    "criterion",
    "cc",
    "bindgen",
]
