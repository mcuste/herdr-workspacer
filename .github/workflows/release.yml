name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-version.py "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: herdr-workspacer-linux-x86_64
            cross: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            asset: herdr-workspacer-linux-aarch64
            cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            asset: herdr-workspacer-macos-x86_64
            cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            asset: herdr-workspacer-macos-aarch64
            cross: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp "target/${{ matrix.target }}/release/herdr-workspacer" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: shasum -a 256 herdr-workspacer-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          dist/herdr-workspacer-*
          dist/SHA256SUMS

  publish-crate:
    name: Publish crates.io package
    needs: publish
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether this version is already published
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if cargo info "herdr-workspacer@${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.published.outputs.exists == 'false'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.published.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
