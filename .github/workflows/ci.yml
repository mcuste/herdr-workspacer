name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Verify strict Rust project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - id: cargo-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/just
          key: ${{ runner.os }}-cargo-tools-deny-0.20.2-machete-0.9.2-just-1.58.0
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          cargo install just --version 1.58.0 --locked
      - run: just verify

  release-metadata:
    name: Validate plugin version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - if: ${{ hashFiles('herdr-plugin.toml') != '' }}
        run: python3 scripts/check-version.py
