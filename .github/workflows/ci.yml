name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

  dependency-policy:
    name: Audit dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-tools-deny-0.20.2-machete-0.9.2
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo deny check
      - run: cargo machete

  release-metadata:
    name: Validate plugin version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('herdr-plugin.toml') != '' }}
        run: python3 scripts/check-version.py
